<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:* ws://[::1]:*; media-src blob:; img-src blob: data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    />
    <title>wscrpt agent preview</title>
    <style>
      :root {
        color-scheme: dark;
        background: #07090c;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07090c;
      }

      body {
        display: grid;
        place-items: center;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      [data-preview-root] {
        width: 100%;
        display: grid;
        place-items: center;
        pointer-events: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .preview-frame {
        position: relative;
        width: min(100%, 960px);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 1px solid #252b33;
        border-radius: 10px;
        background: #000;
        box-shadow: 0 14px 48px rgb(0 0 0 / 45%);
      }

      .preview-frame[data-presentation="expanded"] {
        width: min(100%, 1280px);
        max-height: calc(100dvh - 24px);
      }

      .preview-video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      .preview-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #aab4c0;
        background: #090c10;
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
      }

      .preview-frame[data-state="playing"] .preview-status {
        opacity: 0;
      }

      .preview-frame[data-provider="jpeg"]::after {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 4px 7px;
        border-radius: 4px;
        color: #ffd98a;
        background: rgb(20 15 4 / 82%);
        content: "DIAGNOSTIC JPEG · 12 FPS MAX";
        font-size: 10px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main data-preview-root aria-label="Remote agent preview"></main>
    <script type="module" src="/preview-surface.mjs"></script>
  </body>
</html>
