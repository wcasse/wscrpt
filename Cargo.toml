[package]
name = "wscrpt"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "A streamlined remote-first terminal IDE for iPad keyboards over SSH and mosh"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wcasse/wscrpt"
homepage = "https://github.com/wcasse/wscrpt"
documentation = "https://github.com/wcasse/wscrpt#readme"
authors = ["Will Casse <163216174+wcasse@users.noreply.github.com>"]
keywords = ["editor", "terminal", "ide", "ssh", "ipad"]
categories = ["command-line-utilities", "development-tools", "text-editors"]
exclude = [
    "dist/",
    "scratch/",
    "autoresearch/",
    "previewd/",
    "clients/",
    "output/preview-phase0/",
    "docs/REMOTE_AGENT_PREVIEW_PHASE_0*",
    "scripts/verify-preview-phase0.sh",
    ".github/workflows/preview-phase0.yml",
    "docs/assets/",
    "docs/demo.tape",
    "*.log",
]

[[bin]]
name = "wscrpt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
regex = "1.11"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
